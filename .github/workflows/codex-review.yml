# Codex Code Review — Analysis Workflow
#
# This workflow runs Codex to review PRs. It produces a markdown review
# as an artifact but does NOT post comments (no write permissions).
# The companion workflow (codex-review-comment.yml) handles posting.
#
# Triggers:
#   1. workflow_run: Auto-review after pr-jobs passes
#   2. issue_comment: Manual /codex-review or /codex-query by maintainers
#   3. workflow_dispatch: Manual testing
#
# Security:
#   - This job has contents:read ONLY (no PR write, no issue write)
#   - OPENAI_API_KEY is used here but never coexists with write tokens
#   - Codex runs in the checked-out repo and only writes review artifacts
#   - Review methodology: claude_md/code_review.md

name: Codex Code Review

on:
  # Late trigger: full pr-jobs workflow finished. Acts as a fallback if the
  # early-trigger gate never fires (e.g., < 10 checks ever register, or the
  # 50% threshold is only reached when the last job completes).
  workflow_run:
    workflows: ["facebook/rocksdb/pr-jobs"]
    types: [completed]

  # Early trigger: kick off review as soon as ≥50% of registered check runs
  # have succeeded with 0 failures (denominator gated at ≥10 to avoid races
  # with checks still being registered). Most check_run events exit cheaply
  # at the gate; only the first one that crosses the threshold proceeds.
  check_run:
    types: [completed]

  issue_comment:
    types: [created]

  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        required: true
        type: number
      model:
        description: Codex model to use
        required: false
        type: choice
        options:
          - gpt-5.3-codex
          - gpt-5.4
          - gpt-5.2-codex
        default: gpt-5.3-codex
      thinking_budget:
        description: Override MAX_THINKING_TOKENS (blank = auto-classify)
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  # ======================== Auto Review ======================== #
  auto-review:
    name: Auto Codex Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read

    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'pull_request') ||
      (github.event_name == 'check_run' &&
       github.event.check_run.status == 'completed' &&
       github.event.check_run.conclusion == 'success' &&
       !contains(github.event.check_run.name, 'Codex'))

    steps:
      - name: Get PR info and apply early-trigger gate
        id: pr_info
        uses: actions/github-script@v7
        with:
          script: |
            const isCheckRun = context.eventName === 'check_run';
            const headSha = isCheckRun
              ? context.payload.check_run.head_sha
              : context.payload.workflow_run.head_sha;

            if (isCheckRun) {
              const MIN_CHECKS = 10;
              const THRESHOLD = 0.5;
              const FAIL_CONCLUSIONS = new Set([
                'failure', 'cancelled', 'timed_out', 'action_required'
              ]);

              const all = await github.paginate(
                github.rest.checks.listForRef,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: headSha,
                  per_page: 100,
                }
              );
              const checks = all.filter(c =>
                !(c.name && c.name.toLowerCase().includes('codex')));
              const total = checks.length;
              const succeeded = checks.filter(c =>
                c.status === 'completed' && c.conclusion === 'success'
              ).length;
              const failed = checks.filter(c =>
                c.status === 'completed' && FAIL_CONCLUSIONS.has(c.conclusion)
              ).length;
              const ratio = total > 0 ? succeeded / total : 0;

              core.info(
                `[early-gate] sha=${headSha.substring(0, 7)} ` +
                `total=${total} succeeded=${succeeded} failed=${failed} ` +
                `ratio=${ratio.toFixed(2)}`);

              if (total < MIN_CHECKS) {
                core.info(
                  `[early-gate] only ${total} checks registered; ` +
                  `need ≥ ${MIN_CHECKS}. Skipping.`);
                core.setOutput('skip', 'true');
                core.setOutput('skip_reason', `gate:not_enough_checks(${total})`);
                return;
              }
              if (failed > 0) {
                core.info(
                  `[early-gate] ${failed} checks have failed; will let the ` +
                  `workflow_run fallback handle this commit. Skipping.`);
                core.setOutput('skip', 'true');
                core.setOutput('skip_reason', `gate:failed_checks(${failed})`);
                return;
              }
              if (ratio < THRESHOLD) {
                core.info(
                  `[early-gate] only ${(ratio * 100).toFixed(0)}% succeeded; ` +
                  `need ≥ ${THRESHOLD * 100}%. Skipping.`);
                core.setOutput('skip', 'true');
                core.setOutput('skip_reason', `gate:below_threshold(${ratio.toFixed(2)})`);
                return;
              }
              core.info(
                `[early-gate] passed: ${succeeded}/${total} succeeded. ` +
                `Proceeding with early review.`);
            }

            let prNumber = null;
            const prsFromEvent = isCheckRun
              ? (context.payload.check_run.pull_requests || [])
              : (context.payload.workflow_run.pull_requests || []);
            if (prsFromEvent && prsFromEvent.length > 0) {
              prNumber = prsFromEvent[0].number;
            } else {
              for (let attempt = 0; attempt < 5; attempt++) {
                if (attempt > 0) {
                  core.info(`PR not found for SHA ${headSha}, retrying in 10s (attempt ${attempt + 1}/5)...`);
                  await new Promise(r => setTimeout(r, 10000));
                }
                const { data: pulls } = await github.rest.pulls.list({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  state: 'open',
                  sort: 'updated',
                  direction: 'desc',
                  per_page: 100
                });
                const match = pulls.find(p => p.head.sha === headSha);
                if (match) {
                  prNumber = match.number;
                  break;
                }
              }
            }

            if (!prNumber) {
              core.warning(
                `Could not find PR for SHA ${headSha} after retries. ` +
                `This can happen when the PR head advanced before this ` +
                `${context.eventName}-triggered job started. Skipping stale review run.`
              );
              core.setOutput('skip', 'true');
              core.setOutput('skip_reason', `stale_sha:${headSha}`);
              return;
            }

            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });

            core.setOutput('skip', 'false');
            core.setOutput('pr_number', prNumber.toString());
            core.setOutput('head_repo', pr.data.head.repo.clone_url);
            core.setOutput('head_ref', pr.data.head.ref);
            core.setOutput('head_sha', pr.data.head.sha);
            core.setOutput('base_sha', pr.data.base.sha);
            core.setOutput('base_ref', pr.data.base.ref);
            core.setOutput('pr_title', pr.data.title);
            core.setOutput('pr_body', pr.data.body || '');
            core.setOutput('pr_author', pr.data.user.login);

      - name: Skip stale run
        if: steps.pr_info.outputs.skip == 'true'
        run: |-
          echo "Skipping stale auto-review run: ${{ steps.pr_info.outputs.skip_reason }}"

      - name: Check for existing review
        if: steps.pr_info.outputs.skip != 'true'
        id: check_existing
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.pr_info.outputs.pr_number }}
          HEAD_SHA: ${{ steps.pr_info.outputs.head_sha }}
        with:
          script: |
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt(process.env.PR_NUMBER),
              per_page: 100
            });
            const shortSha = process.env.HEAD_SHA.substring(0, 7);
            const marker = `<!-- codex-review-auto-${shortSha} -->`;
            const existing = comments.data.find(c => c.body.includes(marker));
            core.setOutput('skip', existing ? 'true' : 'false');

      - name: Checkout base repository
        if: steps.pr_info.outputs.skip != 'true' && steps.check_existing.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr_info.outputs.base_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        if: steps.pr_info.outputs.skip != 'true' && steps.check_existing.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Codex CLI
        if: steps.pr_info.outputs.skip != 'true' && steps.check_existing.outputs.skip != 'true'
        run: |
          npm install -g @openai/codex
          codex --version

      - name: Generate diff and prompt
        if: steps.pr_info.outputs.skip != 'true' && steps.check_existing.outputs.skip != 'true'
        env:
          HEAD_REPO: ${{ steps.pr_info.outputs.head_repo }}
          HEAD_REF: ${{ steps.pr_info.outputs.head_ref }}
          HEAD_SHA: ${{ steps.pr_info.outputs.head_sha }}
          BASE_SHA: ${{ steps.pr_info.outputs.base_sha }}
          PR_TITLE: ${{ steps.pr_info.outputs.pr_title }}
          PR_BODY: ${{ steps.pr_info.outputs.pr_body }}
          PR_AUTHOR: ${{ steps.pr_info.outputs.pr_author }}
        run: |
          git remote add fork "${HEAD_REPO}" || true
          git fetch fork "${HEAD_REF}" --depth=100

          git diff "${BASE_SHA}...${HEAD_SHA}" > /tmp/pr.diff
          DIFF_STATS=$(git diff --stat "${BASE_SHA}...${HEAD_SHA}" | tail -1)

          DIFF_SIZE=$(wc -c < /tmp/pr.diff)
          IS_TRUNCATED=false
          if [ "$DIFF_SIZE" -gt 100000 ]; then
            head -c 100000 /tmp/pr.diff > /tmp/pr_truncated.diff
            mv /tmp/pr_truncated.diff /tmp/pr.diff
            IS_TRUNCATED=true
          fi

          cat claude_md/ci_review_prompt.md > /tmp/prompt.txt

          printf '\n## Pull Request Information\n' >> /tmp/prompt.txt
          printf '%s\n' "- **Title:** ${PR_TITLE}" >> /tmp/prompt.txt
          printf '%s\n' "- **Author:** ${PR_AUTHOR}" >> /tmp/prompt.txt
          printf '%s\n' "- **Changes:** ${DIFF_STATS}" >> /tmp/prompt.txt

          if [ "${IS_TRUNCATED}" = "true" ]; then
            echo "- **Note:** Diff truncated due to size." >> /tmp/prompt.txt
          fi

          printf '\n## PR Description\n' >> /tmp/prompt.txt
          printf '%s\n' "${PR_BODY}" >> /tmp/prompt.txt
          printf '\n---\n\n## Diff to Review\n\n' >> /tmp/prompt.txt
          cat /tmp/pr.diff >> /tmp/prompt.txt

      - name: Build complexity-classifier prompt
        if: steps.pr_info.outputs.skip != 'true' && steps.check_existing.outputs.skip != 'true'
        run: |
          cp claude_md/ci_complexity_eval_prompt.md /tmp/complexity_prompt.txt
          printf '\n---\n\n## Diff Summary\n\n' >> /tmp/complexity_prompt.txt
          git diff --stat "${{ steps.pr_info.outputs.base_sha }}...${{ steps.pr_info.outputs.head_sha }}" >> /tmp/complexity_prompt.txt
          printf '\n## Changed Files\n\n' >> /tmp/complexity_prompt.txt
          git diff --name-only "${{ steps.pr_info.outputs.base_sha }}...${{ steps.pr_info.outputs.head_sha }}" >> /tmp/complexity_prompt.txt
          printf '\n## Diff (truncated to 30KB)\n\n' >> /tmp/complexity_prompt.txt
          head -c 30000 /tmp/pr.diff >> /tmp/complexity_prompt.txt

      - name: Classify PR complexity
        if: steps.pr_info.outputs.skip != 'true' && steps.check_existing.outputs.skip != 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_HOME: /tmp/codex-home
          CODEX_MODEL: gpt-5.3-codex
        run: |
          mkdir -p "${CODEX_HOME}"
          codex exec \
            -m "${CODEX_MODEL}" \
            -c model_reasoning_effort="medium" \
            --dangerously-bypass-approvals-and-sandbox \
            --output-last-message codex-complexity-output.txt \
            - < /tmp/complexity_prompt.txt > codex-complexity.log 2>&1

      - name: Pick thinking budget
        if: steps.pr_info.outputs.skip != 'true' && steps.check_existing.outputs.skip != 'true'
        id: budget
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let label = 'complex';
            try {
              const text = fs.readFileSync('codex-complexity-output.txt', 'utf8').trim().toLowerCase();
              if (/\bsimple\b/.test(text) && !/\bcomplex\b/.test(text)) {
                label = 'simple';
              }
            } catch (e) {
              core.warning(`Could not parse classifier output: ${e.message}`);
            }
            const effort = label === 'simple' ? 'high' : 'xhigh';
            core.info(`Complexity classified as: ${label} → model_reasoning_effort=${effort}`);
            core.setOutput('label', label);
            core.setOutput('effort', effort);

      - name: Run Codex
        if: steps.pr_info.outputs.skip != 'true' && steps.check_existing.outputs.skip != 'true'
        id: codex
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_HOME: /tmp/codex-home
          CODEX_MODEL: gpt-5.3-codex
          CODEX_REASONING_EFFORT: ${{ steps.budget.outputs.effort }}
          BASE_SHA: ${{ steps.pr_info.outputs.base_sha }}
          PR_TITLE: ${{ steps.pr_info.outputs.pr_title }}
        run: |
          mkdir -p "${CODEX_HOME}"
          set +e
          codex exec review \
            --base "${BASE_SHA}" \
            --title "${PR_TITLE}" \
            -m "${CODEX_MODEL}" \
            -c model_reasoning_effort="${CODEX_REASONING_EFFORT}" \
            --dangerously-bypass-approvals-and-sandbox \
            --output-last-message codex-review-output.md \
            - < /tmp/prompt.txt > codex-review-execution.log 2>&1
          exit_code=$?
          set -e
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"
          echo "${exit_code}" > codex-review-exit-code.txt

      - name: Recover partial review
        if: >-
          steps.pr_info.outputs.skip != 'true' &&
          steps.check_existing.outputs.skip != 'true' &&
          steps.codex.outputs.exit_code != '0' &&
          hashFiles('review-findings.md') != ''
        id: recover
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_HOME: /tmp/codex-home
          CODEX_MODEL: gpt-5.3-codex
          CODEX_REASONING_EFFORT: ${{ steps.budget.outputs.effort }}
        run: |
          set +e
          codex exec \
            -m "${CODEX_MODEL}" \
            -c model_reasoning_effort="${CODEX_REASONING_EFFORT}" \
            --dangerously-bypass-approvals-and-sandbox \
            --output-last-message codex-review-recovery.md \
            - < claude_md/ci_recovery_prompt.md > codex-review-recovery.log 2>&1
          exit_code=$?
          set -e
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"

      - name: Build review comment
        if: steps.pr_info.outputs.skip != 'true' && steps.check_existing.outputs.skip != 'true'
        uses: actions/github-script@v7
        env:
          RESPONSE_FILE: codex-review-output.md
          RECOVERY_FILE: codex-review-recovery.md
          FINDINGS_FILE: review-findings.md
          LOG_FILE: codex-review-execution.log
          EXIT_CODE: ${{ steps.codex.outputs.exit_code }}
          HEAD_SHA: ${{ steps.pr_info.outputs.head_sha }}
          USED_RECOVERY: ${{ steps.recover.outputs.exit_code == '0' && 'true' || 'false' }}
        with:
          script: |
            const parse = require('./.github/scripts/parse-codex-review.js');
            const fs = require('fs');
            const body = parse({
              responseFile: process.env.RESPONSE_FILE,
              recoveryFile: process.env.RECOVERY_FILE,
              findingsFile: process.env.FINDINGS_FILE,
              logFile: process.env.LOG_FILE,
              exitCode: process.env.EXIT_CODE,
              meta: {
                trigger: 'auto',
                headSha: process.env.HEAD_SHA,
                reviewer: '',
                isQuery: false,
                isPartial: process.env.USED_RECOVERY === 'true' ||
                  (!fs.existsSync(process.env.RESPONSE_FILE) &&
                   fs.existsSync(process.env.FINDINGS_FILE)),
              }
            });
            fs.writeFileSync('codex-review-comment.md', body);

      - name: Save PR number
        if: steps.pr_info.outputs.skip != 'true' && steps.check_existing.outputs.skip != 'true'
        run: echo "${{ steps.pr_info.outputs.pr_number }}" > pr_number.txt

      - name: Save trigger metadata
        if: steps.pr_info.outputs.skip != 'true' && steps.check_existing.outputs.skip != 'true'
        run: |
          echo "auto" > trigger_type.txt
          echo "${{ steps.pr_info.outputs.head_sha }}" > head_sha.txt

      - name: Upload review artifact
        if: always() && steps.pr_info.outputs.skip != 'true' && steps.check_existing.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: codex-review-result
          path: |
            codex-review-comment.md
            pr_number.txt
            trigger_type.txt
            head_sha.txt
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload review logs
        if: always() && steps.pr_info.outputs.skip != 'true' && steps.check_existing.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: codex-review-logs
          path: |
            codex-review-execution.log
            codex-complexity.log
            codex-complexity-output.txt
            codex-review-recovery.log
            codex-review-output.md
            codex-review-recovery.md
            review-findings.md
            codex-review-exit-code.txt
          retention-days: 7
          if-no-files-found: ignore

  # ======================== Manual Review ======================== #
  manual-review:
    name: Manual Codex Review
    runs-on: ubuntu-latest
    permissions:
      contents: read

    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        (contains(github.event.comment.body, '/codex-review') || contains(github.event.comment.body, '/codex-query')) &&
        contains(fromJSON('["pdillinger", "jaykorean", "hx235", "dannyhchen", "joshkang97", "zaidoon1", "omkarhgawde", "xingbowang", "anand1976", "virajthakur", "nmk70", "archang19", "mszeszko-meta", "yoshinorim", "cbi42"]'), github.event.comment.user.login)
      )

    steps:
      - name: Detect command type
        id: command
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === 'workflow_dispatch') {
              core.setOutput('type', 'review');
              core.setOutput('query', '');
              return;
            }
            const body = context.payload.comment.body;
            if (body.includes('/codex-review')) {
              core.setOutput('type', 'review');
              const match = body.match(/\/codex-review\s+([\s\S]*)/);
              core.setOutput('query', match ? match[1].trim() : '');
            } else if (body.includes('/codex-query')) {
              const match = body.match(/\/codex-query\s+([\s\S]*)/);
              const query = match ? match[1].trim() : '';
              if (!query) {
                core.setFailed('No query provided. Usage: /codex-query <your question>');
                return;
              }
              core.setOutput('type', 'query');
              core.setOutput('query', query);
            } else {
              core.setFailed('Unknown command');
            }

      - name: Get PR details
        id: pr_info
        uses: actions/github-script@v7
        env:
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            const prNumber = context.eventName === 'workflow_dispatch'
              ? parseInt(process.env.INPUT_PR_NUMBER, 10)
              : context.issue.number;

            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });

            core.setOutput('pr_number', prNumber.toString());
            core.setOutput('head_repo', pr.data.head.repo.clone_url);
            core.setOutput('head_ref', pr.data.head.ref);
            core.setOutput('head_sha', pr.data.head.sha);
            core.setOutput('base_sha', pr.data.base.sha);
            core.setOutput('base_ref', pr.data.base.ref);
            core.setOutput('pr_title', pr.data.title);
            core.setOutput('pr_body', pr.data.body || '');
            core.setOutput('pr_author', pr.data.user.login);

      - name: Checkout base repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr_info.outputs.base_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Codex CLI
        run: |
          npm install -g @openai/codex
          codex --version

      - name: Generate diff and prompt
        env:
          HEAD_REPO: ${{ steps.pr_info.outputs.head_repo }}
          HEAD_REF: ${{ steps.pr_info.outputs.head_ref }}
          HEAD_SHA: ${{ steps.pr_info.outputs.head_sha }}
          BASE_SHA: ${{ steps.pr_info.outputs.base_sha }}
          PR_TITLE: ${{ steps.pr_info.outputs.pr_title }}
          PR_BODY: ${{ steps.pr_info.outputs.pr_body }}
          PR_AUTHOR: ${{ steps.pr_info.outputs.pr_author }}
          COMMAND_TYPE: ${{ steps.command.outputs.type }}
          ADDITIONAL_CONTEXT: ${{ steps.command.outputs.query }}
          USER_QUERY: ${{ steps.command.outputs.query }}
        run: |
          git remote add fork "${HEAD_REPO}" || true
          git fetch fork "${HEAD_REF}" --depth=100

          git diff "${BASE_SHA}...${HEAD_SHA}" > /tmp/pr.diff
          DIFF_STATS=$(git diff --stat "${BASE_SHA}...${HEAD_SHA}" | tail -1)

          DIFF_SIZE=$(wc -c < /tmp/pr.diff)
          IS_TRUNCATED=false
          if [ "$DIFF_SIZE" -gt 100000 ]; then
            head -c 100000 /tmp/pr.diff > /tmp/pr_truncated.diff
            mv /tmp/pr_truncated.diff /tmp/pr.diff
            IS_TRUNCATED=true
          fi

          if [ "${COMMAND_TYPE}" = "query" ]; then
            cat claude_md/ci_query_prompt.md > /tmp/prompt.txt
            printf '\n---\n\n' >> /tmp/prompt.txt

            printf '## Pull Request Context\n' >> /tmp/prompt.txt
            printf '%s\n' "- **Title:** ${PR_TITLE}" >> /tmp/prompt.txt
            printf '%s\n' "- **Author:** ${PR_AUTHOR}" >> /tmp/prompt.txt
            printf '%s\n' "- **Changes:** ${DIFF_STATS}" >> /tmp/prompt.txt
            printf '\n## PR Description\n' >> /tmp/prompt.txt
            printf '%s\n' "${PR_BODY}" >> /tmp/prompt.txt
            printf '\n## Question\n' >> /tmp/prompt.txt
            printf '%s\n' "${USER_QUERY}" >> /tmp/prompt.txt
            printf '\n---\n## PR Diff (for reference)\n' >> /tmp/prompt.txt
            cat /tmp/pr.diff >> /tmp/prompt.txt
          else
            cat claude_md/ci_review_prompt.md > /tmp/prompt.txt

            printf '\n## Pull Request Information\n' >> /tmp/prompt.txt
            printf '%s\n' "- **Title:** ${PR_TITLE}" >> /tmp/prompt.txt
            printf '%s\n' "- **Author:** ${PR_AUTHOR}" >> /tmp/prompt.txt
            printf '%s\n' "- **Changes:** ${DIFF_STATS}" >> /tmp/prompt.txt

            if [ "${IS_TRUNCATED}" = "true" ]; then
              echo "- **Note:** Diff truncated due to size." >> /tmp/prompt.txt
            fi

            printf '\n## PR Description\n' >> /tmp/prompt.txt
            printf '%s\n' "${PR_BODY}" >> /tmp/prompt.txt

            if [ -n "${ADDITIONAL_CONTEXT}" ]; then
              printf '\n## Additional Instructions from Reviewer\n' >> /tmp/prompt.txt
              printf '%s\n' "${ADDITIONAL_CONTEXT}" >> /tmp/prompt.txt
            fi

            printf '\n---\n\n## Diff to Review\n\n' >> /tmp/prompt.txt
            cat /tmp/pr.diff >> /tmp/prompt.txt
          fi

      - name: Build complexity-classifier prompt
        if: steps.command.outputs.type == 'review'
        env:
          BASE_SHA: ${{ steps.pr_info.outputs.base_sha }}
          HEAD_SHA: ${{ steps.pr_info.outputs.head_sha }}
        run: |
          cp claude_md/ci_complexity_eval_prompt.md /tmp/complexity_prompt.txt
          printf '\n---\n\n## Diff Summary\n\n' >> /tmp/complexity_prompt.txt
          git diff --stat "${BASE_SHA}...${HEAD_SHA}" >> /tmp/complexity_prompt.txt
          printf '\n## Changed Files\n\n' >> /tmp/complexity_prompt.txt
          git diff --name-only "${BASE_SHA}...${HEAD_SHA}" >> /tmp/complexity_prompt.txt
          printf '\n## Diff (truncated to 30KB)\n\n' >> /tmp/complexity_prompt.txt
          head -c 30000 /tmp/pr.diff >> /tmp/complexity_prompt.txt

      - name: Classify PR complexity
        if: steps.command.outputs.type == 'review'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_HOME: /tmp/codex-home
          CODEX_MODEL: ${{ github.event_name == 'workflow_dispatch' && inputs.model || 'gpt-5.3-codex' }}
        run: |
          mkdir -p "${CODEX_HOME}"
          codex exec \
            -m "${CODEX_MODEL}" \
            -c model_reasoning_effort="medium" \
            --dangerously-bypass-approvals-and-sandbox \
            --output-last-message codex-complexity-output.txt \
            - < /tmp/complexity_prompt.txt > codex-complexity.log 2>&1

      - name: Pick thinking budget
        id: budget
        env:
          OVERRIDE: ${{ inputs.thinking_budget }}
          COMMAND_TYPE: ${{ steps.command.outputs.type }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (process.env.COMMAND_TYPE !== 'review') {
              core.setOutput('label', 'query');
              core.setOutput('effort', 'medium');
              return;
            }
            const override = (process.env.OVERRIDE || '').trim();
            if (override && /^\d+$/.test(override)) {
              const budget = parseInt(override, 10);
              const effort = budget >= 32000 ? 'xhigh' : 'high';
              core.info(`Using thinking_budget override: ${override} → model_reasoning_effort=${effort}`);
              core.setOutput('label', 'override');
              core.setOutput('effort', effort);
              return;
            }
            let label = 'complex';
            try {
              const text = fs.readFileSync('codex-complexity-output.txt', 'utf8').trim().toLowerCase();
              if (/\bsimple\b/.test(text) && !/\bcomplex\b/.test(text)) {
                label = 'simple';
              }
            } catch (e) {
              core.warning(`Could not parse classifier output: ${e.message}`);
            }
            const effort = label === 'simple' ? 'high' : 'xhigh';
            core.info(`Complexity classified as: ${label} → model_reasoning_effort=${effort}`);
            core.setOutput('label', label);
            core.setOutput('effort', effort);

      - name: Run Codex
        id: codex
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_HOME: /tmp/codex-home
          CODEX_MODEL: ${{ github.event_name == 'workflow_dispatch' && inputs.model || 'gpt-5.3-codex' }}
          CODEX_REASONING_EFFORT: ${{ steps.budget.outputs.effort }}
          BASE_SHA: ${{ steps.pr_info.outputs.base_sha }}
          PR_TITLE: ${{ steps.pr_info.outputs.pr_title }}
          COMMAND_TYPE: ${{ steps.command.outputs.type }}
        run: |
          mkdir -p "${CODEX_HOME}"
          set +e
          if [ "${COMMAND_TYPE}" = "query" ]; then
            codex exec \
              -m "${CODEX_MODEL}" \
              -c model_reasoning_effort="${CODEX_REASONING_EFFORT}" \
              --dangerously-bypass-approvals-and-sandbox \
              --output-last-message codex-review-output.md \
              - < /tmp/prompt.txt > codex-review-execution.log 2>&1
          else
            codex exec review \
              --base "${BASE_SHA}" \
              --title "${PR_TITLE}" \
              -m "${CODEX_MODEL}" \
              -c model_reasoning_effort="${CODEX_REASONING_EFFORT}" \
              --dangerously-bypass-approvals-and-sandbox \
              --output-last-message codex-review-output.md \
              - < /tmp/prompt.txt > codex-review-execution.log 2>&1
          fi
          exit_code=$?
          set -e
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"
          echo "${exit_code}" > codex-review-exit-code.txt

      - name: Recover partial review
        if: >-
          steps.command.outputs.type == 'review' &&
          steps.codex.outputs.exit_code != '0' &&
          hashFiles('review-findings.md') != ''
        id: recover
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_HOME: /tmp/codex-home
          CODEX_MODEL: ${{ github.event_name == 'workflow_dispatch' && inputs.model || 'gpt-5.3-codex' }}
          CODEX_REASONING_EFFORT: ${{ steps.budget.outputs.effort }}
        run: |
          set +e
          codex exec \
            -m "${CODEX_MODEL}" \
            -c model_reasoning_effort="${CODEX_REASONING_EFFORT}" \
            --dangerously-bypass-approvals-and-sandbox \
            --output-last-message codex-review-recovery.md \
            - < claude_md/ci_recovery_prompt.md > codex-review-recovery.log 2>&1
          exit_code=$?
          set -e
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"

      - name: Build review comment
        uses: actions/github-script@v7
        env:
          RESPONSE_FILE: codex-review-output.md
          RECOVERY_FILE: codex-review-recovery.md
          FINDINGS_FILE: review-findings.md
          LOG_FILE: codex-review-execution.log
          EXIT_CODE: ${{ steps.codex.outputs.exit_code }}
          HEAD_SHA: ${{ steps.pr_info.outputs.head_sha }}
          REVIEWER: ${{ github.event_name == 'workflow_dispatch' && github.actor || github.event.comment.user.login }}
          COMMAND_TYPE: ${{ steps.command.outputs.type }}
          USED_RECOVERY: ${{ steps.recover.outputs.exit_code == '0' && 'true' || 'false' }}
        with:
          script: |
            const parse = require('./.github/scripts/parse-codex-review.js');
            const fs = require('fs');
            const body = parse({
              responseFile: process.env.RESPONSE_FILE,
              recoveryFile: process.env.RECOVERY_FILE,
              findingsFile: process.env.FINDINGS_FILE,
              logFile: process.env.LOG_FILE,
              exitCode: process.env.EXIT_CODE,
              meta: {
                trigger: 'manual',
                headSha: process.env.HEAD_SHA,
                reviewer: process.env.REVIEWER,
                isQuery: process.env.COMMAND_TYPE !== 'review',
                isPartial: process.env.USED_RECOVERY === 'true' ||
                  (!fs.existsSync(process.env.RESPONSE_FILE) &&
                   fs.existsSync(process.env.FINDINGS_FILE)),
              }
            });
            fs.writeFileSync('codex-review-comment.md', body);

      - name: Save PR number
        run: echo "${{ steps.pr_info.outputs.pr_number }}" > pr_number.txt

      - name: Save trigger metadata
        env:
          REVIEWER: ${{ github.event_name == 'workflow_dispatch' && github.actor || github.event.comment.user.login }}
          COMMENT_ID: ${{ github.event.comment.id }}
          HEAD_SHA: ${{ steps.pr_info.outputs.head_sha }}
        run: |
          echo "manual" > trigger_type.txt
          echo "${REVIEWER}" > reviewer.txt
          echo "${COMMENT_ID}" > comment_id.txt
          echo "${HEAD_SHA}" > head_sha.txt

      - name: Upload review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-review-result
          path: |
            codex-review-comment.md
            pr_number.txt
            trigger_type.txt
            reviewer.txt
            comment_id.txt
            head_sha.txt
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload review logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-review-logs
          path: |
            codex-review-execution.log
            codex-complexity.log
            codex-complexity-output.txt
            codex-review-recovery.log
            codex-review-output.md
            codex-review-recovery.md
            review-findings.md
            codex-review-exit-code.txt
          retention-days: 7
          if-no-files-found: ignore
