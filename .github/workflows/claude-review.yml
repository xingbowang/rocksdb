# Claude Code Review — Analysis Workflow
#
# This workflow runs Claude to review PRs. It produces a markdown review
# as an artifact but does NOT post comments (no write permissions).
# The companion workflow (claude-review-comment.yml) handles posting.
#
# Triggers:
#   1. workflow_run: Auto-review after pr-jobs passes
#   2. issue_comment: Manual /claude-review or /claude-query by maintainers
#   3. workflow_dispatch: Manual testing
#
# Security:
#   - This job has contents:read ONLY (no PR write, no issue write)
#   - ANTHROPIC_API_KEY is used here but never coexists with write tokens
#   - Claude uses read-only tools (View, GlobTool, GrepTool) plus Write
#     (only for incremental findings file, not repo modifications)
#   - Review methodology: claude_md/code_review.md

name: Claude Code Review

on:
  # Late trigger: full pr-jobs workflow finished. Acts as a fallback if the
  # early-trigger gate never fires (e.g., < 10 checks ever register, or the
  # 50% threshold is only reached when the last job completes).
  workflow_run:
    workflows: ["facebook/rocksdb/pr-jobs"]
    types: [completed]

  # Early trigger: kick off review as soon as ≥50% of registered check runs
  # have succeeded with 0 failures (denominator gated at ≥10 to avoid races
  # with checks still being registered). Most check_run events exit cheaply
  # at the gate; only the first one that crosses the threshold proceeds.
  check_run:
    types: [completed]

  issue_comment:
    types: [created]

  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        required: true
        type: number
      model:
        description: Claude model to use (defaults to latest Opus)
        required: false
        type: choice
        options:
          - claude-opus-4-7
          - claude-opus-4-6
          - claude-sonnet-4-6
        default: claude-opus-4-7
      thinking_budget:
        description: Override MAX_THINKING_TOKENS (blank = auto-classify)
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  # ======================== Auto Review ======================== #
  auto-review:
    name: Auto Claude Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read

    # Accept three sources:
    #   1. workflow_run (fallback after pr-jobs completes successfully)
    #   2. check_run.completed (early trigger; gate logic in pr_info step
    #      decides whether to actually proceed). Only consider 'success'
    #      conclusions and skip our own check runs to avoid feedback loops.
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'pull_request') ||
      (github.event_name == 'check_run' &&
       github.event.check_run.status == 'completed' &&
       github.event.check_run.conclusion == 'success' &&
       !contains(github.event.check_run.name, 'Claude'))

    steps:
      - name: Get PR info and apply early-trigger gate
        id: pr_info
        uses: actions/github-script@v7
        with:
          script: |
            const isCheckRun = context.eventName === 'check_run';

            // ── 1. Resolve head SHA from whichever event fired ──
            const headSha = isCheckRun
              ? context.payload.check_run.head_sha
              : context.payload.workflow_run.head_sha;

            // ── 2. Early-trigger gate (only for check_run events) ──
            //   - Denominator must be ≥ MIN_CHECKS to avoid race conditions
            //     where only a handful of checks have been registered.
            //   - 0 failures (any failure means we shouldn't optimistically
            //     run the review yet — wait for the workflow_run fallback).
            //   - succeeded / total ≥ THRESHOLD.
            //   - Filter out our own Claude review check runs to break the
            //     feedback loop.
            if (isCheckRun) {
              const MIN_CHECKS = 10;
              const THRESHOLD = 0.5;
              const FAIL_CONCLUSIONS = new Set([
                'failure', 'cancelled', 'timed_out', 'action_required'
              ]);

              const all = await github.paginate(
                github.rest.checks.listForRef,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: headSha,
                  per_page: 100,
                }
              );
              // Exclude our own Claude review jobs from the denominator.
              const checks = all.filter(c =>
                !(c.name && c.name.toLowerCase().includes('claude')));
              const total = checks.length;
              const succeeded = checks.filter(c =>
                c.status === 'completed' && c.conclusion === 'success'
              ).length;
              const failed = checks.filter(c =>
                c.status === 'completed' && FAIL_CONCLUSIONS.has(c.conclusion)
              ).length;
              const ratio = total > 0 ? succeeded / total : 0;

              core.info(
                `[early-gate] sha=${headSha.substring(0, 7)} ` +
                `total=${total} succeeded=${succeeded} failed=${failed} ` +
                `ratio=${ratio.toFixed(2)}`);

              if (total < MIN_CHECKS) {
                core.info(
                  `[early-gate] only ${total} checks registered; ` +
                  `need ≥ ${MIN_CHECKS}. Skipping.`);
                core.setOutput('skip', 'true');
                core.setOutput('skip_reason', `gate:not_enough_checks(${total})`);
                return;
              }
              if (failed > 0) {
                core.info(
                  `[early-gate] ${failed} checks have failed; will let the ` +
                  `workflow_run fallback handle this commit. Skipping.`);
                core.setOutput('skip', 'true');
                core.setOutput('skip_reason', `gate:failed_checks(${failed})`);
                return;
              }
              if (ratio < THRESHOLD) {
                core.info(
                  `[early-gate] only ${(ratio * 100).toFixed(0)}% succeeded; ` +
                  `need ≥ ${THRESHOLD * 100}%. Skipping.`);
                core.setOutput('skip', 'true');
                core.setOutput('skip_reason', `gate:below_threshold(${ratio.toFixed(2)})`);
                return;
              }
              core.info(
                `[early-gate] passed: ${succeeded}/${total} succeeded. ` +
                `Proceeding with early review.`);
            }

            // ── 3. Resolve PR number ──
            let prNumber = null;
            const prsFromEvent = isCheckRun
              ? (context.payload.check_run.pull_requests || [])
              : (context.payload.workflow_run.pull_requests || []);
            if (prsFromEvent && prsFromEvent.length > 0) {
              prNumber = prsFromEvent[0].number;
            } else {
              // PR may not be registered yet if push and PR creation raced.
              // Retry up to 5 times with 10s delay.
              for (let attempt = 0; attempt < 5; attempt++) {
                if (attempt > 0) {
                  core.info(`PR not found for SHA ${headSha}, retrying in 10s (attempt ${attempt + 1}/5)...`);
                  await new Promise(r => setTimeout(r, 10000));
                }
                const { data: pulls } = await github.rest.pulls.list({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  state: 'open',
                  sort: 'updated',
                  direction: 'desc',
                  per_page: 100
                });
                const match = pulls.find(p => p.head.sha === headSha);
                if (match) {
                  prNumber = match.number;
                  break;
                }
              }
            }

            if (!prNumber) {
              core.warning(
                `Could not find PR for SHA ${headSha} after retries. ` +
                `This can happen when the PR head advanced before this ` +
                `${context.eventName}-triggered job started. Skipping stale review run.`
              );
              core.setOutput('skip', 'true');
              core.setOutput('skip_reason', `stale_sha:${headSha}`);
              return;
            }

            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });

            core.setOutput('skip', 'false');
            core.setOutput('pr_number', prNumber.toString());
            core.setOutput('head_repo', pr.data.head.repo.clone_url);
            core.setOutput('head_ref', pr.data.head.ref);
            core.setOutput('head_sha', pr.data.head.sha);
            core.setOutput('base_sha', pr.data.base.sha);
            core.setOutput('base_ref', pr.data.base.ref);
            core.setOutput('pr_title', pr.data.title);
            core.setOutput('pr_body', pr.data.body || '');
            core.setOutput('pr_author', pr.data.user.login);

      - name: Skip stale run
        if: steps.pr_info.outputs.skip == 'true'
        run: |-
          echo "Skipping stale auto-review run: ${{ steps.pr_info.outputs.skip_reason }}"

      - name: Check for existing review
        if: steps.pr_info.outputs.skip != 'true'
        id: check_existing
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.pr_info.outputs.pr_number }}
          HEAD_SHA: ${{ steps.pr_info.outputs.head_sha }}
        with:
          script: |
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt(process.env.PR_NUMBER),
              per_page: 100
            });
            const shortSha = process.env.HEAD_SHA.substring(0, 7);
            // Skip if there's already an auto-review comment for THIS commit.
            // (Each commit gets its own comment, so we key on the SHA marker.)
            const marker = `<!-- claude-review-auto-${shortSha} -->`;
            const existing = comments.data.find(c => c.body.includes(marker));
            core.setOutput('skip', existing ? 'true' : 'false');

      - name: Checkout base repository
        if: steps.pr_info.outputs.skip != 'true' && steps.check_existing.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr_info.outputs.base_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Generate diff and prompt
        if: steps.pr_info.outputs.skip != 'true' && steps.check_existing.outputs.skip != 'true'
        env:
          HEAD_REPO: ${{ steps.pr_info.outputs.head_repo }}
          HEAD_REF: ${{ steps.pr_info.outputs.head_ref }}
          HEAD_SHA: ${{ steps.pr_info.outputs.head_sha }}
          BASE_SHA: ${{ steps.pr_info.outputs.base_sha }}
          PR_TITLE: ${{ steps.pr_info.outputs.pr_title }}
          PR_BODY: ${{ steps.pr_info.outputs.pr_body }}
          PR_AUTHOR: ${{ steps.pr_info.outputs.pr_author }}
        run: |
          git remote add fork "${HEAD_REPO}" || true
          git fetch fork "${HEAD_REF}" --depth=100

          git diff "${BASE_SHA}...${HEAD_SHA}" > /tmp/pr.diff
          DIFF_STATS=$(git diff --stat "${BASE_SHA}...${HEAD_SHA}" | tail -1)

          DIFF_SIZE=$(wc -c < /tmp/pr.diff)
          IS_TRUNCATED=false
          if [ "$DIFF_SIZE" -gt 100000 ]; then
            head -c 100000 /tmp/pr.diff > /tmp/pr_truncated.diff
            mv /tmp/pr_truncated.diff /tmp/pr.diff
            IS_TRUNCATED=true
          fi

          cat claude_md/ci_review_prompt.md > /tmp/prompt.txt

          printf '\n## Pull Request Information\n' >> /tmp/prompt.txt
          printf '%s\n' "- **Title:** ${PR_TITLE}" >> /tmp/prompt.txt
          printf '%s\n' "- **Author:** ${PR_AUTHOR}" >> /tmp/prompt.txt
          printf '%s\n' "- **Changes:** ${DIFF_STATS}" >> /tmp/prompt.txt

          if [ "${IS_TRUNCATED}" = "true" ]; then
            echo "- **Note:** Diff truncated due to size." >> /tmp/prompt.txt
          fi

          printf '\n## PR Description\n' >> /tmp/prompt.txt
          printf '%s\n' "${PR_BODY}" >> /tmp/prompt.txt
          printf '\n---\n\n## Diff to Review\n\n' >> /tmp/prompt.txt
          cat /tmp/pr.diff >> /tmp/prompt.txt

      - name: Build complexity-classifier prompt
        if: steps.pr_info.outputs.skip != 'true' && steps.check_existing.outputs.skip != 'true'
        run: |
          cp claude_md/ci_complexity_eval_prompt.md /tmp/complexity_prompt.txt
          printf '\n---\n\n## Diff Summary\n\n' >> /tmp/complexity_prompt.txt
          git diff --stat "${{ steps.pr_info.outputs.base_sha }}...${{ steps.pr_info.outputs.head_sha }}" >> /tmp/complexity_prompt.txt
          printf '\n## Changed Files\n\n' >> /tmp/complexity_prompt.txt
          git diff --name-only "${{ steps.pr_info.outputs.base_sha }}...${{ steps.pr_info.outputs.head_sha }}" >> /tmp/complexity_prompt.txt
          printf '\n## Diff (truncated to 30KB)\n\n' >> /tmp/complexity_prompt.txt
          head -c 30000 /tmp/pr.diff >> /tmp/complexity_prompt.txt

      - name: Classify PR complexity (Sonnet)
        if: steps.pr_info.outputs.skip != 'true' && steps.check_existing.outputs.skip != 'true'
        id: classify
        uses: anthropics/claude-code-base-action@beta
        with:
          prompt_file: /tmp/complexity_prompt.txt
          model: claude-sonnet-4-6
          max_turns: "10"
          timeout_minutes: "10"
          allowed_tools: "View,GlobTool,GrepTool"
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Pick thinking budget
        if: steps.pr_info.outputs.skip != 'true' && steps.check_existing.outputs.skip != 'true'
        id: budget
        env:
          EXECUTION_FILE: ${{ steps.classify.outputs.execution_file }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            // Defaults: simple = xhigh (16k), complex = max (32k).
            // Default to "complex" if classification is unreadable.
            let label = 'complex';
            try {
              const log = JSON.parse(fs.readFileSync(process.env.EXECUTION_FILE, 'utf8'));
              const result = log.find(m => m.type === 'result');
              const text = (result && result.result) ? result.result.trim().toLowerCase() : '';
              if (/\bsimple\b/.test(text) && !/\bcomplex\b/.test(text)) {
                label = 'simple';
              }
            } catch (e) {
              core.warning(`Could not parse classifier output: ${e.message}`);
            }
            const budget = label === 'simple' ? '16000' : '32000';
            core.info(`Complexity classified as: ${label} → MAX_THINKING_TOKENS=${budget}`);
            core.setOutput('label', label);
            core.setOutput('tokens', budget);

      - name: Run Claude
        if: steps.pr_info.outputs.skip != 'true' && steps.check_existing.outputs.skip != 'true'
        id: claude
        env:
          MAX_THINKING_TOKENS: ${{ steps.budget.outputs.tokens }}
          CLAUDE_COMPLEXITY: ${{ steps.budget.outputs.label }}
        uses: anthropics/claude-code-base-action@beta
        with:
          prompt_file: /tmp/prompt.txt
          model: claude-opus-4-7
          max_turns: "300"
          timeout_minutes: "60"
          allowed_tools: "View,GlobTool,GrepTool,Write,Task"
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Recover partial review on turn limit
        if: steps.pr_info.outputs.skip != 'true' && steps.check_existing.outputs.skip != 'true'
        id: recover
        uses: actions/github-script@v7
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        with:
          script: |
            const fs = require('fs');
            const log = JSON.parse(fs.readFileSync(process.env.EXECUTION_FILE, 'utf8'));
            const result = log.find(m => m.type === 'result');
            const hitLimit = result && result.subtype === 'error_max_turns';
            const hasFindings = fs.existsSync('review-findings.md');
            core.setOutput('hit_limit', hitLimit ? 'true' : 'false');
            core.setOutput('has_findings', hasFindings ? 'true' : 'false');
            core.setOutput('needs_recovery', (hitLimit && hasFindings) ? 'true' : 'false');

      - name: Format partial findings
        if: >-
          steps.pr_info.outputs.skip != 'true' &&
          steps.check_existing.outputs.skip != 'true' &&
          steps.recover.outputs.needs_recovery == 'true'
        id: format_recovery
        uses: anthropics/claude-code-base-action@beta
        with:
          prompt_file: claude_md/ci_recovery_prompt.md
          model: claude-sonnet-4-6
          max_turns: "10"
          allowed_tools: "View,GlobTool,GrepTool"
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Build review comment
        if: steps.pr_info.outputs.skip != 'true' && steps.check_existing.outputs.skip != 'true'
        uses: actions/github-script@v7
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          RECOVERY_FILE: ${{ steps.format_recovery.outputs.execution_file }}
          CONCLUSION: ${{ steps.claude.outputs.conclusion }}
          HEAD_SHA: ${{ steps.pr_info.outputs.head_sha }}
          NEEDS_RECOVERY: ${{ steps.recover.outputs.needs_recovery }}
        with:
          script: |
            const parse = require('./.github/scripts/parse-claude-review.js');
            const fs = require('fs');
            let execFile = process.env.EXECUTION_FILE;
            if (process.env.NEEDS_RECOVERY === 'true') {
              const rf = process.env.RECOVERY_FILE;
              if (rf && fs.existsSync(rf)) {
                execFile = rf;
              }
            }
            const body = parse({
              executionFile: execFile,
              conclusion: process.env.CONCLUSION,
              meta: {
                trigger: 'auto',
                headSha: process.env.HEAD_SHA,
                reviewer: '',
                isQuery: false,
                isPartial: process.env.NEEDS_RECOVERY === 'true',
              }
            });
            fs.writeFileSync('claude-review-comment.md', body);

      - name: Save PR number
        if: steps.pr_info.outputs.skip != 'true' && steps.check_existing.outputs.skip != 'true'
        run: echo "${{ steps.pr_info.outputs.pr_number }}" > pr_number.txt

      - name: Save trigger metadata
        if: steps.pr_info.outputs.skip != 'true' && steps.check_existing.outputs.skip != 'true'
        run: |
          echo "auto" > trigger_type.txt
          echo "${{ steps.pr_info.outputs.head_sha }}" > head_sha.txt

      - name: Upload review artifact
        if: always() && steps.pr_info.outputs.skip != 'true' && steps.check_existing.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: claude-review-result
          path: |
            claude-review-comment.md
            pr_number.txt
            trigger_type.txt
            head_sha.txt
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload execution log
        if: always() && steps.pr_info.outputs.skip != 'true' && steps.check_existing.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: claude-review-execution-log
          path: ${{ steps.claude.outputs.execution_file }}
          retention-days: 7
          if-no-files-found: warn

      - name: Upload recovery execution log
        if: always() && steps.pr_info.outputs.skip != 'true' && steps.recover.outputs.needs_recovery == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: claude-review-recovery-log
          path: ${{ steps.format_recovery.outputs.execution_file }}
          retention-days: 7
          if-no-files-found: ignore

  # ======================== Manual Review ======================== #
  manual-review:
    name: Manual Claude Review
    runs-on: ubuntu-latest
    permissions:
      contents: read

    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        (contains(github.event.comment.body, '/claude-review') || contains(github.event.comment.body, '/claude-query')) &&
        contains(fromJSON('["pdillinger", "jaykorean", "hx235", "dannyhchen", "joshkang97", "zaidoon1", "omkarhgawde", "xingbowang", "anand1976", "virajthakur", "nmk70", "archang19", "mszeszko-meta", "yoshinorim", "cbi42"]'), github.event.comment.user.login)
      )

    steps:
      - name: Detect command type
        id: command
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === 'workflow_dispatch') {
              core.setOutput('type', 'review');
              core.setOutput('query', '');
              return;
            }
            const body = context.payload.comment.body;
            if (body.includes('/claude-review')) {
              core.setOutput('type', 'review');
              const match = body.match(/\/claude-review\s+([\s\S]*)/);
              core.setOutput('query', match ? match[1].trim() : '');
            } else if (body.includes('/claude-query')) {
              const match = body.match(/\/claude-query\s+([\s\S]*)/);
              const query = match ? match[1].trim() : '';
              if (!query) {
                core.setFailed('No query provided. Usage: /claude-query <your question>');
                return;
              }
              core.setOutput('type', 'query');
              core.setOutput('query', query);
            } else {
              core.setFailed('Unknown command');
            }

      - name: Get PR details
        id: pr_info
        uses: actions/github-script@v7
        env:
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            const prNumber = context.eventName === 'workflow_dispatch'
              ? parseInt(process.env.INPUT_PR_NUMBER, 10)
              : context.issue.number;

            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });

            core.setOutput('pr_number', prNumber.toString());
            core.setOutput('head_repo', pr.data.head.repo.clone_url);
            core.setOutput('head_ref', pr.data.head.ref);
            core.setOutput('head_sha', pr.data.head.sha);
            core.setOutput('base_sha', pr.data.base.sha);
            core.setOutput('base_ref', pr.data.base.ref);
            core.setOutput('pr_title', pr.data.title);
            core.setOutput('pr_body', pr.data.body || '');
            core.setOutput('pr_author', pr.data.user.login);

      - name: Checkout base repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr_info.outputs.base_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Generate diff and prompt
        env:
          HEAD_REPO: ${{ steps.pr_info.outputs.head_repo }}
          HEAD_REF: ${{ steps.pr_info.outputs.head_ref }}
          HEAD_SHA: ${{ steps.pr_info.outputs.head_sha }}
          BASE_SHA: ${{ steps.pr_info.outputs.base_sha }}
          PR_TITLE: ${{ steps.pr_info.outputs.pr_title }}
          PR_BODY: ${{ steps.pr_info.outputs.pr_body }}
          PR_AUTHOR: ${{ steps.pr_info.outputs.pr_author }}
          DIFF_STATS: ""
          COMMAND_TYPE: ${{ steps.command.outputs.type }}
          ADDITIONAL_CONTEXT: ${{ steps.command.outputs.query }}
          USER_QUERY: ${{ steps.command.outputs.query }}
        run: |
          git remote add fork "${HEAD_REPO}" || true
          git fetch fork "${HEAD_REF}" --depth=100

          git diff "${BASE_SHA}...${HEAD_SHA}" > /tmp/pr.diff
          DIFF_STATS=$(git diff --stat "${BASE_SHA}...${HEAD_SHA}" | tail -1)

          DIFF_SIZE=$(wc -c < /tmp/pr.diff)
          IS_TRUNCATED=false
          if [ "$DIFF_SIZE" -gt 100000 ]; then
            head -c 100000 /tmp/pr.diff > /tmp/pr_truncated.diff
            mv /tmp/pr_truncated.diff /tmp/pr.diff
            IS_TRUNCATED=true
          fi

          if [ "${COMMAND_TYPE}" = "query" ]; then
            # Query prompt
            cat claude_md/ci_query_prompt.md > /tmp/prompt.txt
            printf '\n---\n\n' >> /tmp/prompt.txt

            printf '## Pull Request Context\n' >> /tmp/prompt.txt
            printf '%s\n' "- **Title:** ${PR_TITLE}" >> /tmp/prompt.txt
            printf '%s\n' "- **Author:** ${PR_AUTHOR}" >> /tmp/prompt.txt
            printf '%s\n' "- **Changes:** ${DIFF_STATS}" >> /tmp/prompt.txt
            printf '\n## PR Description\n' >> /tmp/prompt.txt
            printf '%s\n' "${PR_BODY}" >> /tmp/prompt.txt
            printf '\n## Question\n' >> /tmp/prompt.txt
            printf '%s\n' "${USER_QUERY}" >> /tmp/prompt.txt
            printf '\n---\n## PR Diff (for reference)\n' >> /tmp/prompt.txt
            cat /tmp/pr.diff >> /tmp/prompt.txt
          else
            # Review prompt
            cat claude_md/ci_review_prompt.md > /tmp/prompt.txt

            printf '\n## Pull Request Information\n' >> /tmp/prompt.txt
            printf '%s\n' "- **Title:** ${PR_TITLE}" >> /tmp/prompt.txt
            printf '%s\n' "- **Author:** ${PR_AUTHOR}" >> /tmp/prompt.txt
            printf '%s\n' "- **Changes:** ${DIFF_STATS}" >> /tmp/prompt.txt

            if [ "${IS_TRUNCATED}" = "true" ]; then
              echo "- **Note:** Diff truncated due to size." >> /tmp/prompt.txt
            fi

            printf '\n## PR Description\n' >> /tmp/prompt.txt
            printf '%s\n' "${PR_BODY}" >> /tmp/prompt.txt

            if [ -n "${ADDITIONAL_CONTEXT}" ]; then
              printf '\n## Additional Instructions from Reviewer\n' >> /tmp/prompt.txt
              printf '%s\n' "${ADDITIONAL_CONTEXT}" >> /tmp/prompt.txt
            fi

            printf '\n---\n\n## Diff to Review\n\n' >> /tmp/prompt.txt
            cat /tmp/pr.diff >> /tmp/prompt.txt
          fi

      - name: Build complexity-classifier prompt
        if: steps.command.outputs.type == 'review'
        env:
          BASE_SHA: ${{ steps.pr_info.outputs.base_sha }}
          HEAD_SHA: ${{ steps.pr_info.outputs.head_sha }}
        run: |
          cp claude_md/ci_complexity_eval_prompt.md /tmp/complexity_prompt.txt
          printf '\n---\n\n## Diff Summary\n\n' >> /tmp/complexity_prompt.txt
          git diff --stat "${BASE_SHA}...${HEAD_SHA}" >> /tmp/complexity_prompt.txt
          printf '\n## Changed Files\n\n' >> /tmp/complexity_prompt.txt
          git diff --name-only "${BASE_SHA}...${HEAD_SHA}" >> /tmp/complexity_prompt.txt
          printf '\n## Diff (truncated to 30KB)\n\n' >> /tmp/complexity_prompt.txt
          head -c 30000 /tmp/pr.diff >> /tmp/complexity_prompt.txt

      - name: Classify PR complexity (Sonnet)
        if: steps.command.outputs.type == 'review'
        id: classify
        uses: anthropics/claude-code-base-action@beta
        with:
          prompt_file: /tmp/complexity_prompt.txt
          model: claude-sonnet-4-6
          max_turns: "10"
          timeout_minutes: "10"
          allowed_tools: "View,GlobTool,GrepTool"
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Pick thinking budget
        id: budget
        env:
          EXECUTION_FILE: ${{ steps.classify.outputs.execution_file }}
          OVERRIDE: ${{ inputs.thinking_budget }}
          COMMAND_TYPE: ${{ steps.command.outputs.type }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            // Queries skip the classifier and use a moderate budget.
            if (process.env.COMMAND_TYPE !== 'review') {
              core.setOutput('label', 'query');
              core.setOutput('tokens', '8000');
              return;
            }
            // Manual override takes precedence.
            const override = (process.env.OVERRIDE || '').trim();
            if (override && /^\d+$/.test(override)) {
              core.info(`Using thinking_budget override: ${override}`);
              core.setOutput('label', 'override');
              core.setOutput('tokens', override);
              return;
            }
            let label = 'complex';
            try {
              const log = JSON.parse(fs.readFileSync(process.env.EXECUTION_FILE, 'utf8'));
              const result = log.find(m => m.type === 'result');
              const text = (result && result.result) ? result.result.trim().toLowerCase() : '';
              if (/\bsimple\b/.test(text) && !/\bcomplex\b/.test(text)) {
                label = 'simple';
              }
            } catch (e) {
              core.warning(`Could not parse classifier output: ${e.message}`);
            }
            const budget = label === 'simple' ? '16000' : '32000';
            core.info(`Complexity classified as: ${label} → MAX_THINKING_TOKENS=${budget}`);
            core.setOutput('label', label);
            core.setOutput('tokens', budget);

      - name: Run Claude
        id: claude
        env:
          MAX_THINKING_TOKENS: ${{ steps.budget.outputs.tokens }}
          CLAUDE_COMPLEXITY: ${{ steps.budget.outputs.label }}
        uses: anthropics/claude-code-base-action@beta
        with:
          prompt_file: /tmp/prompt.txt
          model: ${{ github.event_name == 'workflow_dispatch' && inputs.model || 'claude-opus-4-7' }}
          max_turns: "300"
          timeout_minutes: "60"
          allowed_tools: "View,GlobTool,GrepTool,Write,Task"
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Recover partial review on turn limit
        id: recover
        uses: actions/github-script@v7
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          COMMAND_TYPE: ${{ steps.command.outputs.type }}
        with:
          script: |
            const fs = require('fs');
            // Skip recovery for queries — only reviews use incremental findings
            if (process.env.COMMAND_TYPE === 'query') {
              core.setOutput('needs_recovery', 'false');
              return;
            }
            const log = JSON.parse(fs.readFileSync(process.env.EXECUTION_FILE, 'utf8'));
            const result = log.find(m => m.type === 'result');
            const hitLimit = result && result.subtype === 'error_max_turns';
            const hasFindings = fs.existsSync('review-findings.md');
            core.setOutput('hit_limit', hitLimit ? 'true' : 'false');
            core.setOutput('has_findings', hasFindings ? 'true' : 'false');
            core.setOutput('needs_recovery', (hitLimit && hasFindings) ? 'true' : 'false');

      - name: Format partial findings
        if: steps.recover.outputs.needs_recovery == 'true'
        id: format_recovery
        uses: anthropics/claude-code-base-action@beta
        with:
          prompt_file: claude_md/ci_recovery_prompt.md
          model: claude-sonnet-4-6
          max_turns: "10"
          allowed_tools: "View,GlobTool,GrepTool"
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Build review comment
        uses: actions/github-script@v7
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          RECOVERY_FILE: ${{ steps.format_recovery.outputs.execution_file }}
          CONCLUSION: ${{ steps.claude.outputs.conclusion }}
          HEAD_SHA: ${{ steps.pr_info.outputs.head_sha }}
          REVIEWER: ${{ github.event_name == 'workflow_dispatch' && github.actor || github.event.comment.user.login }}
          COMMAND_TYPE: ${{ steps.command.outputs.type }}
          NEEDS_RECOVERY: ${{ steps.recover.outputs.needs_recovery }}
        with:
          script: |
            const parse = require('./.github/scripts/parse-claude-review.js');
            const fs = require('fs');
            const isReview = process.env.COMMAND_TYPE === 'review';
            let execFile = process.env.EXECUTION_FILE;
            if (process.env.NEEDS_RECOVERY === 'true') {
              const rf = process.env.RECOVERY_FILE;
              if (rf && fs.existsSync(rf)) {
                execFile = rf;
              }
            }
            const body = parse({
              executionFile: execFile,
              conclusion: process.env.CONCLUSION,
              meta: {
                trigger: 'manual',
                headSha: process.env.HEAD_SHA,
                reviewer: process.env.REVIEWER,
                isQuery: !isReview,
                isPartial: process.env.NEEDS_RECOVERY === 'true',
              }
            });
            fs.writeFileSync('claude-review-comment.md', body);

      - name: Save PR number
        run: echo "${{ steps.pr_info.outputs.pr_number }}" > pr_number.txt

      - name: Save trigger metadata
        env:
          REVIEWER: ${{ github.event_name == 'workflow_dispatch' && github.actor || github.event.comment.user.login }}
          COMMENT_ID: ${{ github.event.comment.id }}
          HEAD_SHA: ${{ steps.pr_info.outputs.head_sha }}
        run: |
          echo "manual" > trigger_type.txt
          echo "${REVIEWER}" > reviewer.txt
          echo "${COMMENT_ID}" > comment_id.txt
          echo "${HEAD_SHA}" > head_sha.txt

      - name: Upload review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-review-result
          path: |
            claude-review-comment.md
            pr_number.txt
            trigger_type.txt
            reviewer.txt
            comment_id.txt
            head_sha.txt
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload execution log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-review-execution-log
          path: ${{ steps.claude.outputs.execution_file }}
          retention-days: 7
          if-no-files-found: warn

      - name: Upload recovery execution log
        if: always() && steps.recover.outputs.needs_recovery == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: claude-review-recovery-log
          path: ${{ steps.format_recovery.outputs.execution_file }}
          retention-days: 7
          if-no-files-found: ignore
